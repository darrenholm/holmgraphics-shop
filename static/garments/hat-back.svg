<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="Hat, back view">
  <!-- Crown (back panel) -->
  <path d="M 50 150
           C 40 95, 60 60, 100 60
           C 140 60, 160 95, 150 150
           Z"
        fill="#f5f5f5" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Brim (small visible sliver behind cap from back view) -->
  <path d="M 50 150
           C 50 142, 150 142, 150 150
           Z"
        fill="#e0e0e0" stroke="#333" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Center back panel seam -->
  <line x1="100" y1="60" x2="100" y2="150" stroke="#333" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Adjustable strap opening -->
  <path d="M 85 150 L 85 138 L 115 138 L 115 150"
        fill="#fff" stroke="#333" stroke-width="1"/>
  <!-- Strap holes -->
  <circle cx="91" cy="144" r="1.2" fill="#333"/>
  <circle cx="97" cy="144" r="1.2" fill="#333"/>
  <circle cx="103" cy="144" r="1.2" fill="#333"/>
  <circle cx="109" cy="144" r="1.2" fill="#333"/>
  <!-- Side panel seams -->
  <line x1="75" y1="65" x2="68" y2="150" stroke="#333" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="125" y1="65" x2="132" y2="150" stroke="#333" stroke-width="0.8" stroke-dasharray="2,2"/>
</svg>
